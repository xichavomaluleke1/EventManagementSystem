name: CI - Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Test, and Dockerize
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore event_management_system.slnx

      - name: Build solution (API & MVC)
        run: dotnet build event_management_system.slnx --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test event_management_system.slnx --no-build --configuration Release --verbosity normal --logger "console;verbosity=detailed"

      # 🆕 Phase 8 Requirement: Build the MVC project in Docker
      - name: Build Docker Image
        run: |
          docker build -t raceday-mvc -f RaceDayMVC/Dockerfile .
